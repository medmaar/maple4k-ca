name: Deploy Site

on:
  push:
    branches: [main]
    paths-ignore:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Find the Pages project serving maple4k.ca
        id: project
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects" \
            -H "Authorization: Bearer $CF_API_TOKEN" > projects.json
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import json, sys
          d = json.load(open('projects.json'))
          if not d.get('success'):
              sys.exit('Cloudflare API error: %s' % d.get('errors'))
          for p in d['result']:
              print('project:', p['name'], p.get('domains'), file=sys.stderr)
          match = [p for p in d['result'] if 'maple4k.ca' in (p.get('domains') or [])]
          if not match:
              sys.exit('No Pages project has the maple4k.ca domain')
          print('name=' + match[0]['name'])
          print('branch=' + (match[0].get('production_branch') or 'main'))
          EOF
          rm projects.json

      - run: npm ci

      - run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@3 pages deploy out
          --project-name "${{ steps.project.outputs.name }}"
          --branch "${{ steps.project.outputs.branch }}"
          --commit-dirty=true
